          \"#d5dfe5\",\n        );\n        poly(\n          [\n            [x, y],\n            [x + bw, y],\n            [x + bw, y - bh],\n            [x, y - bh],\n          ],\n          closed ? \"#ced7dc\" : \"#fafcfd\",\n        );\n        poly(\n          [\n            [x + bw, y],\n            [x + bw + depth, y - depth * 0.55],\n            [x + bw + depth, y - bh - depth * 0.55],\n            [x + bw, y - bh],\n          ],\n          closed ? \"#b8c7cf\" : \"#bdcdd6\",\n        );\n        poly(\n          [\n            [x, y - bh],\n            [x + depth, y - bh - depth * 0.55],\n            [x + bw + depth, y - bh - depth * 0.55],\n            [x + bw, y - bh],\n          ],\n          closed ? \"#b8c7cf\" : \"#d1dfe5\",\n        );\n        line(x, y - bh - 5, x + bw, y - bh - 5, \"#becdd3\", 3);\n        line(x, y - bh - 5, x + bw * adoption, y - bh - 5, \"#278f91\", 3);\n        const wr = n / 4,\n          ww = bw * 0.12,\n          wh = Math.min(11, ((bh - 17) / wr) * 0.53),\n          gap = (bh - 17) / wr;\n        people.forEach((p, j) => {\n          const v = mix(+p.employed, +future[j].employed, f),\n            wx = x + bw * 0.13 + (j % 4) * bw * 0.205,\n            wy = y - bh + 10 + Math.floor(j / 4) * gap;\n          ctx.fillStyle = \"#dce5ea\";\n          ctx.fillRect(wx, wy, ww, wh);\n          ctx.globalAlpha = v;\n          ctx.fillStyle = \"#d77c65\";\n          ctx.fillRect(wx, wy, ww, wh);\n          ctx.globalAlpha = 1;\n        });\n        ctx.fillStyle = closed ? \"#9babb6\" : \"#7992a2\";\n        ctx.fillRect(x + bw * 0.44, y - 9, bw * 0.12, 9);\n        line(x, y + 10, x + bw, y + 10, \"#c6d3db\", 3);\n        line(x, y + 10, x + (bw * Math.min(2, rev)) / 2, y + 10, \"#617e96\", 3);\n        line(x + bw / 2, y + 7, x + bw / 2, y + 13, \"#314e62\", 1);\n        label(\n          closed ? `${id} · 폐업` : id,\n          x + bw / 2,\n          y + 29,\n          portrait ? 9 : 11,\n          closed ? \"#946454\" : \"#58717e\ atches,\n      last = 0;\n    const mix = (a, b, t) => a + (b - a) * t;\n    const prepared = runs.map((run) =>\n      run.frames.map((frame) => {\n        let active = 0,\n          exited = 0;\n        return frame.physicians.map((d) => ({\n          id: d.id,\n          employed: d.employed,\n          rank: d.employed ? active++ : exited++,\n        }));\n      }),\n    );\n    function size(canvas) {\n      const r = canvas.getBoundingClientRect(),\n        d = devicePixelRatio || 1;\n      if (\n        canvas.width !== Math.round(r.width * d) ||\n        canvas.height !== Math.round(r.height * d)\n      ) {\n        canvas.width = Math.round(r.width * d);\n        canvas.height = Math.round(r.height * d);\n      }\n      const ctx = canvas.getContext(\"2d\");\n      ctx.setTransform(d, 0, 0, d, 0, 0);\n      ctx.clearRect(0, 0, r.width, r.height);\n      return { ctx, w: r.width, h: r.height };\n    }\n    function point(d, w, h) {\n      const columns = w \u003c 220 ? 12 : 24;\n      const rows = Math.ceil(192 / columns),\n        pitch = (w - 12) / columns;\n      return {\n        x: 6 + ((d.rank % columns) + 0.5) * pitch,\n        y: d.employed\n          ? 30 +\n            (Math.floor(d.rank / columns) * (h * 0.55 - 34)) /\n              Math.max(1, rows - 1)\n          : h * 0.76 +\n            (Math.floor(d.rank / columns) * (h * 0.24 - 8)) /\n              Math.max(1, rows - 1),\n      };\n    }\n    const maxIncome =\n      Math.max(\n        ...runs.flatMap((r) => r.frames.map((f) => f.metrics.incomeIndex)),\n      ) * 1.08;\n    function draw() {\n      const a = Math.min(9, Math.floor(time)),\n        b = a + 1,\n        t = time - a,\n        smooth = reduced.matches ? (t \u003c 1 ? 0 : 1) : t * t * (3 - 2 * t);\n      $(\"year\").textContent = String(2026 + Math.floor(time));\n      $(\"time\").value = String(time);\n      $(\"time\").setAttribute(\"aria-valuetext\", `${(2026 + time).toFixed(1)}년`);\n      $(\"elapsed\").textContent = `${Math.round(time * 2.4)} / 24s`;\n      runs.forEach((run, k) => {\n        const one = run.frames[a],\n          two = run.frames[b],\n          emp = mix(one.metrics.employmentRate, two.metrics.employmentRate, t),\n          income = mix(one.metrics.incomeIndex, two.metrics.incomeIndex, t);\n        $(\"emp\" + k).textContent = (emp * 100).toFixed(0);\n        $(\"inc\" + k).textContent = income.toFixed(0);\n        const canvas = $(\"people\" + k),\n          { ctx, w, h } = size(canvas);\n        canvas.setAttribute(\n          \"aria-label\",\n          `${2026 + Math.floor(time)}년 진료 중 ${(emp * 100).toFixed(0)}%, 평균 소득 ${income.toFixed(0)}`,\n        );\n        ctx.strokeStyle = \"#ffffff18\";\n        ctx.beginPath();\n        ctx.moveTo(0, h * 0.65);\n        ctx.lineTo(w, h * 0.65);\n        ctx.stroke();\n        const radius = w \u003c 220 ? 1.8 : 2.7;\n        prepared[k][a].forEach((d, i) => {\n          const e = prepared[k][b][i],\n            p = point(d, w, h),\n            q = point(e, w, h),\n            x = mix(p.x, q.x, smooth),\n            y = mix(p.y, q.y, smooth),\n            active = mix(+d.employed, +e.employed, smooth);\n          if (\n            !reduced.matches &&\n            Math.abs(q.y - p.y) > 2 &&\n            smooth > 0 &&\n            smooth \u003c 1\n          ) {\n            ctx.strokeStyle = colors[k];\n            ctx.globalAlpha = 0.15;\n            ctx.beginPath();\n            ctx.moveTo(p.x, p.y);\n            ctx.quadraticCurveTo(p.x, q.y, x, y);\n            ctx.stroke();\n          }\n          ctx.globalAlpha = 0.75;\n          ctx.strokeStyle = colors[k];\n          ctx.lineWidth = 0.8;\n          ctx.beginPath();\n          ctx.arc(x, y, radius, 0, Math.PI * 2);\n          ctx.stroke();\n          ctx.globalAlpha = active;\n          ctx.fillStyle = colors[k];\n          ctx.fill();\n          ctx.globalAlpha = 1;\n        });\n        const sc = size($(\"spark\" + k)),\n          yc = (value) => sc.h - 3 - (value / maxIncome) * (sc.h - 6);\n        sc.ctx.strokeStyle = \"#ffffff22\";\n        sc.ctx.setLineDash([3, 4]);\n        sc.ctx.beginPath();\n        sc.ctx.moveTo(0, yc(100));\n        sc.ctx.lineTo(sc.w, yc(100));\n        sc.ctx.stroke();\n        sc.ctx.setLineDash([]);\n        sc.ctx.strokeStyle = colors[k];\n        sc.ctx.lineWidth = 2;\n        sc.ctx.beginPath();\n        for (let i = 0; i \u003c= Math.floor(time); i++) {\n          const x = (i / 10) * (sc.w - 4) + 2,\n            y = yc(run.frames[i].metrics.incomeIndex);\n          i ? sc.ctx.lineTo(x, y) : sc.ctx.moveTo(x, y);\n        }\n        sc.ctx.lineTo((time / 10) * (sc.w - 4) + 2, yc(income));\n        sc.ctx.stroke();\n        sc.ctx.fillStyle = colors[k];\n        sc.ctx.beginPath();\n        sc.ctx.arc(\n          (time / 10) * (sc.w - 4) + 2,\n          yc(income),\n          2.8,\n          0,\n          Math.PI * 2,\n        );\n        sc.ctx.fill();\n      });\n    }\n    function button() {\n      $(\"play\").textContent = playing ? \"Ⅱ\" : \"▶\";\n      $(\"play\").setAttribute(\"aria-label\", playing ? \"일시정지\" : \"재생\");\n    }\n    $(\"play\").onclick = () => {\n      if (time >= 10) time = 0;\n      playing = !playing;\n      last = 0;\n      button();\n      draw();\n    };\n    $(\"restart\").onclick = () => {\n      time = 0;\n      playing = true;\n      last = 0;\n      button();\n      draw();\n    };\n    $(\"time\").oninput = (e) => {\n      time = Number(e.target.value);\n      playing = false;\n      button();\n      draw();\n    };\n    addEventListener(\"resize\", draw);\n    reduced.addEventListener(\"change\", () => {\n      if (reduced.matches) {\n        playing = false;\n        button();\n        draw();\n      }\n    });\n    document.addEventListener(\"visibilitychange\", () => (last = 0));\n    function tick(now) {\n      if (playing && !document.hidden) {\n        if (last) time = Math.min(10, time + (now - last) / 2400);\n        if (time >= 10) {\n          playing = false;\n          button();\n        }\n        draw();\n      }\n      last = now;\n      requestAnimationFrame(tick);\n    }\n    button();\n    draw();\n    requestAnimationFrame(tick);\n  \u003c/script>\n\u003c/html>\n"};
const buttons=[...document.querySelectorAll('button[data-view]')],stage=document.querySelector('#stage');
function show(name){const selected=buttons.find(b=>b.dataset.view===name)||buttons[0];for(const button of buttons)button.setAttribute('aria-current',String(button===selected));stage.srcdoc=embeddedViews[selected.dataset.view];stage.title=`${selected.textContent.trim()} 애니메이션`;history.replaceState(null,'',`#${selected.dataset.view}`);}
for(const button of buttons)button.addEventListener('click',()=>show(button.dataset.view));
