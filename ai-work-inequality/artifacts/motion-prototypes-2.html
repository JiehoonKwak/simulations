 const $ = (s) => document.querySelector(s),\n      canvas = $(\"#scene\"),\n      ctx = canvas.getContext(\"2d\"),\n      reduced = matchMedia(\"(prefers-reduced-motion: reduce)\");\n    let run = simulate(DEFAULT_PARAMS, 42),\n      t = 0,\n      playing = !reduced.matches,\n      last = 0,\n      w = 0,\n      h = 0,\n      proj;\n    const mix = (a, b, f) => a + (b - a) * f;\n    function polygon(points, color) {\n      ctx.fillStyle = color;\n      ctx.beginPath();\n      points.forEach((p, i) => {\n        const q = proj(...p);\n        i ? ctx.lineTo(...q) : ctx.moveTo(...q);\n      });\n      ctx.closePath();\n      ctx.fill();\n    }\n    function ground(x, y, b, d, color, z = 0) {\n      polygon(\n        [\n          [x, y, z],\n          [x + b, y, z],\n          [x + b, y + d, z],\n          [x, y + d, z],\n        ],\n        color,\n      );\n    }\n    function cube(x, y, b, d, z, front, side, roof) {\n      polygon(\n        [\n          [x, y + d, 0],\n          [x + b, y + d, 0],\n          [x + b, y + d, z],\n          [x, y + d, z],\n        ],\n        front,\n      );\n      polygon(\n        [\n          [x + b, y, 0],\n          [x + b, y + d, 0],\n          [x + b, y + d, z],\n          [x + b, y, z],\n        ],\n        side,\n      );\n      ground(x, y, b, d, roof, z);\n    }\n    function tree(x, y, size = 9) {\n      const p = proj(x, y, 0),\n        q = proj(x, y, size * 1.7);\n      ctx.strokeStyle = \"#8d8f74\";\n      ctx.lineWidth = 2;\n      ctx.beginPath();\n      ctx.moveTo(...p);\n      ctx.lineTo(...q);\n      ctx.stroke();\n      ctx.fillStyle = \"#9dad87\";\n      ctx.beginPath();\n      ctx.ellipse(\n        q[0],\n        q[1],\n        size * proj.scale,\n        size * 1.12 * proj.scale,\n        0,\n        0,\n        Math.PI * 2,\n      );\n      ctx.fill();\n      ctx.fillStyle = \"#b1be98\";\n      ctx.beginPath();\n      ctx.ellipse(\n        q[0] - size * 0.24 * proj.scale,\n        q[1] - size * 0.27 * proj.scale,\n        size * 0.6 * proj.scale,\n        size * 0.68 * proj.scale,\n        0,\n        0,\n        Math.PI * 2,\n      );\n      ctx.fill();\n    }\n    function draw() {\n      ctx.clearRect(0, 0, w, h);\n      const mobile = w \u003c 600,\n        cols = mobile ? 2 : 4,\n        rows = 16 / cols,\n        pitch = 128,\n        W = cols * pitch,\n        H = rows * pitch,\n        skew = mobile ? 0.055 : 0.43;\n      const scale =\n        Math.min((w - 30) / (W + H * skew + 30), (h - 28) / (H * 0.57 + 85)) *\n        (reduced.matches ? 1 : 1 + 0.025 * Math.sin((t / 10) * Math.PI));\n      const ox = (w - (W + H * skew) * scale) / 2,\n        oy = (h - H * 0.57 * scale) / 2 + 25 * scale;\n      proj = (x, y, z = 0) => [\n        ox + (x + y * skew) * scale,\n        oy + (y * 0.57 - z) * scale,\n      ];\n      proj.scale = scale;\n      // Streets, lawns and trees are scenery; only hospital windows and roof lights encode data.\n      ground(-13, -13, W + 26, H + 26, \"#e5e3d6\");\n      for (let r = 0; r \u003c= rows; r++)\n        ground(-13, r * pitch - 12, W + 26, 15, \"#c5c9bf\");\n      for (let c = 0; c \u003c= cols; c++)\n        ground(c * pitch - 12, -13, 15, H + 26, \"#c5c9bf\");\n      for (let r = 0; r \u003c rows; r++)\n        for (let c = 0; c \u003c cols; c++) {\n          const x = c * pitch,\n            y = r * pitch;\n          ground(x + 6, y + 5, 103, 99, \"#efede3\");\n          ground(x + 88, y + 18, 15, 55, \"#c6ceaf\");\n          ground(x + 12, y + 93, 62, 5, \"#d3ccbc\");\n          for (let k = 0; k \u003c 4; k++)\n            ground(x + 21 + k * 13, y - 10, 6, 10, \"#efeee3\");\n        }\n      const a = run.frames[Math.floor(t)],\n        b = run.frames[Math.min(10, Math.floor(t) + 1)],\n        f = t % 1;\n      for (let r = 0; r \u003c rows; r++)\n        for (let c = 0; c \u003c cols; c++) {\n          const i = r * cols + c,\n            pa = a.providers[i],\n            pb = b.providers[i],\n            people = a.physicians.filter((p) => p.providerId === pa.id),\n            next = b.physicians.filter((p) => p.providerId === pa.id),\n            large = people.length === 16,\n            x = c * pitch + 15,\n            y = r * pitch + 17,\n            bw = large ? 65 : 55,\n            depth = large ? 57 : 49,\n            z = large ? 52 : 32,\n            adoption = mix(pa.adoption, pb.adoption, f);\n          ground(x + 10, y + 9, bw + 10, depth + 12, \"#d1d2c1\");\n          cube(\n            x,\n            y,\n            bw,\n            depth,\n            z,\n            pa.closed ? \"#c0c2b6\" : \"#f9f7ed\",\n            pa.closed ? \"#abae9f\" : \"#d7ccba\",\n            pa.closed ? \"#b3b8a8\" : \"#e7dfce\",\n          );\n          // Front windows have a fixed identity and exactly match the 8- or 16-person team.\n          people.forEach((p, j) => {\n            const col = j % 4,\n              row = Math.floor(j / 4),\n              wx = x + 8 + (col * (bw - 16)) / 4,\n              wz = z - 8 - row * 10,\n              v = mix(+p.employed, +next[j].employed, f);\n            polygon(\n              [\n                [wx, y + depth, wz],\n                [wx + 7, y + depth, wz],\n                [wx + 7, y + depth, wz - 6],\n                [wx, y + depth, wz - 6],\n              ],\n              \"#c6cfc6\",\n            );\n            ctx.globalAlpha = v;\n            polygon(\n              [\n                [wx, y + depth, wz],\n                [wx + 7, y + depth, wz],\n                [wx + 7, y + depth, wz - 6],\n                [wx, y + depth, wz - 6],\n              ],\n              \"#ca8059\",\n            );\n            ctx.globalAlpha = 1;\n          });\n          polygon(\n            [\n              [x + bw * 0.43, y + depth, 0],\n              [x + bw * 0.58, y + depth, 0],\n              [x + bw * 0.58, y + depth, 9],\n              [x + bw * 0.43, y + depth, 9],\n            ],\n            \"#8eab9c\",\n          );\n          // Roof equipment becomes illuminated with adoption; its area stays fixed.\n          ground(x + 9, y + 10, 22, 19, \"#99aaa1\", z + 0.5);\n          ctx.globalAlpha = adoption;\n          ground(x + 9, y + 10, 22, 19, \"#61b99f\", z + 1);\n          ctx.globalAlpha = 1;\n          for (let k = 0; k \u003c 3; k++) {\n            ctx.globalAlpha = 0.25 + 0.75 * adoption;\n            ground(x + 12 + k * 6, y + 13, 3, 12, \"#def8d7\", z + 1.5);\n            ctx.globalAlpha = 1;\n          }\n          ground(x + bw - 19, y + 12, 4, 14, \"#b67760\", z + 1);\n          ground(x + bw - 24, y + 17, 14, 4, \"#b67760\", z + 1);\n          tree(c * pitch + 96, r * pitch + 30, 9);\n          tree(c * pitch + 96, r * pitch + 63, 7);\n          tree(c * pitch + 21, r * pitch + 104, 6);\n        }\n      $(\"#year\").textContent = 2026 + Math.floor(t);\n      $(\"#scrub\").value = t;\n      $(\"#time\").textContent =\n        `${String(Math.round(t * 2.4)).padStart(2, \"0\")} / 24 s`;\n      canvas.setAttribute(\n        \"aria-label\",\n        `${2026 + Math.floor(t)}년, 16개 기관, 진료 의사 ${a.physicians.filter((p) => p.employed).length}명. 창문 하나는 의사 한 명, 지붕 장비 밝기는 AI 도입률.`,\n      );\n    }\n    function resize() {\n      const r = canvas.getBoundingClientRect();\n      w = r.width;\n      h = r.height;\n      const dpr = devicePixelRatio || 1;\n      canvas.width = Math.round(w * dpr);\n      canvas.height = Math.round(h * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      draw();\n    }\n    function sync() {\n      $(\"#play\").textContent = playing ? \"Ⅱ 정지\" : \"▶ 재생\";\n      $(\"#play\").setAttribute(\"aria-label\", playing ? \"일시정지\" : \"재생\");\n    }\n    $(\"#play\").onclick = () => {\n      if (t >= 10) t = 0;\n      playing = !playing;\n      last = 0;\n      sync();\n      draw();\n    };\n    $(\"#replay\").onclick = () => {\n      t = 0;\n      last = 0;\n      playing = !reduced.matches;\n      sync();\n      draw();\n    };\n    $(\"#scrub\").oninput = (e) => {\n = $(\"view\"),\n      ctx = canvas.getContext(\"2d\"),\n      reduced = matchMedia(\"(prefers-reduced-motion: reduce)\");\n    const runs = Object.fromEntries(\n      [\"reference\", \"permission\"].map((id) => [\n        id,\n        simulate(PRESETS.find((p) => p.id === id).params, 42),\n      ]),\n    );\n    let selected = \"permission\",\n      time = 0,\n      playing = !reduced.matches,\n      last = 0;\n    const lerp = (a, b, t) => a + (b - a) * t;\n    function rect(x, y, w, h, c) {\n      ctx.fillStyle = c;\n      ctx.fillRect(x, y, w, h);\n    }\n    function line(x, y, u, v, c, width = 1) {\n      ctx.beginPath();\n      ctx.moveTo(x, y);\n      ctx.lineTo(u, v);\n      ctx.strokeStyle = c;\n      ctx.lineWidth = width;\n      ctx.stroke();\n    }\n    function circle(x, y, r, c) {\n      ctx.beginPath();\n      ctx.arc(x, y, r, 0, Math.PI * 2);\n      ctx.fillStyle = c;\n      ctx.fill();\n    }\n    function person(x, y, alpha) {\n      ctx.save();\n      ctx.globalAlpha = alpha;\n      rect(x - 6, y + 10, 4, 15, \"#52656c\");\n      rect(x + 2, y + 10, 4, 15, \"#52656c\");\n      rect(x - 8, y - 6, 16, 19, \"#fffdf7\");\n      line(x, y - 4, x, y + 11, \"#b1b5af\");\n      rect(x + 4, y, 3, 4, \"#72929b\");\n      circle(x, y - 13, 6, \"#c99476\");\n      ctx.beginPath();\n      ctx.arc(x, y - 14, 6, Math.PI, Math.PI * 2);\n      ctx.fillStyle = \"#5a4d46\";\n      ctx.fill();\n      line(x - 7, y - 2, x - 12, y + 7, \"#fffdf7\", 4);\n      line(x + 7, y - 2, x + 13, y + 5, \"#fffdf7\", 4);\n      ctx.restore();\n    }\n    function room(x, y, w, h, active, adoption) {\n      ctx.save();\n      ctx.translate(x, y);\n      rect(0, 0, w, h, \"#dfcbb9\");\n      rect(\n        4,\n        3,\n        w - 8,\n        h - 17,\n        `rgb(${Math.round(224 + active * 16)},${Math.round(211 + active * 13)},${Math.round(194 + active * 11)})`,\n      );\n      rect(4, h - 26, w - 8, 22, \"#c8b39e\");\n      ctx.fillStyle = \"#b59e8b\";\n      ctx.beginPath(); (1 - active) * 0.3;\n        ctx.strokeStyle = \"#7d7971\";\n        ctx.setLineDash([2, 3]);\n        ctx.strokeRect(w - 83, h - 68, 23, 43);\n        ctx.restore();\n      }\n      rect(0, h - 7, w, 7, \"#a38c7c\");\n      rect(0, 0, 6, h, \"#c0a694\");\n      rect(w - 6, 0, 6, h, \"#c0a694\");\n      rect(0, 0, w, 4, \"#f8efe1\");\n      ctx.restore();\n    }\n    function draw() {\n      const r = canvas.getBoundingClientRect(),\n        d = devicePixelRatio || 1;\n      canvas.width = Math.round(r.width * d);\n      canvas.height = Math.round(r.height * d);\n      ctx.setTransform(d, 0, 0, d, 0, 0);\n      const mobile = r.width \u003c 600,\n        cols = mobile ? 2 : 4,\n        rows = 16 / cols,\n        ww = mobile ? 470 : 1030,\n        hh = mobile ? 960 : 550,\n        scale = Math.min(r.width / ww, r.height / hh);\n      ctx.translate((r.width - ww * scale) / 2, (r.height - hh * scale) / 2);\n      ctx.scale(scale, scale);\n      const push = reduced.matches ? 1 : 1 + time * 0.003;\n      ctx.translate(ww / 2, hh / 2);\n      ctx.scale(push, push);\n      ctx.translate(-ww / 2, -hh / 2);\n      const frames = runs[selected].frames,\n        lo = Math.min(9, Math.floor(time)),\n        hi = lo + 1,\n        f = time - lo,\n        current = frames[Math.round(time)],\n        p0 = frames[lo].providers.find((p) => p.id === \"P2\"),\n        p1 = frames[hi].providers.find((p) => p.id === \"P2\"),\n        p = current.providers.find((p) => p.id === \"P2\"),\n        team0 = frames[lo].physicians.filter((d) => d.providerId === \"P2\"),\n        team1 = frames[hi].physicians.filter((d) => d.providerId === \"P2\"),\n        adoption = lerp(p0.adoption, p1.adoption, f);\n      $(\"year\").textContent = 2026 + Math.round(time);\n      $(\"staff\").textContent =\n        `${p.headcount}명 진료 중${p.closed ? \" · 기관 폐업\" : \"\"}`;\n      $(\"detail\").textContent =\n        `P2 · 수도권 대형기관 · AI 도입 ${Math.round(p.adoption * 100)}%`;\n      $(\"time\").value = time;\n setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);\n        ctx.clearRect(0, 0, width, height);\n        ctx.scale(sceneScale, sceneScale);\n        const sky = ctx.createLinearGradient(0, 0, 0, viewHeight);\n        sky.addColorStop(0, \"#dce5e9\");\n        sky.addColorStop(0.75, \"#ccdbe1\");\n        sky.addColorStop(1, \"#a9bdc8\");\n        ctx.fillStyle = sky;\n        ctx.fillRect(0, 0, viewWidth, viewHeight);\n        // Parallax background is architecture only; no simulated people or patient traffic.\n        for (let i = -2; i \u003c 30; i++) {\n          const bx = i * 158 - camera * 0.24,\n            bh = 65 + ((i * 37) % 75);\n          rect(bx, ground - bh - 8, 118, bh, \"#bacbd3\");\n          rect(bx + 13, ground - bh - 18, 41, 12, \"#bacbd3\");\n        }\n        rect(0, ground + 7, viewWidth, 35, \"#c6d0d2\");\n        line(0, ground + 39, viewWidth, ground + 39, \"#9baeb8\", 2);\n        rect(0, ground + 42, viewWidth, viewHeight - ground, \"#7892a2\");\n        line(0, ground + 45, viewWidth, ground + 45, \"#8fa6b3\", 3);\n        ctx.save();\n        ctx.translate(-camera, 0);\n        for (let i = 0; i \u003c 16; i++) {\n          if (\n            60 + i * pitch > camera + viewWidth + 250 ||\n            60 + i * pitch + 230 \u003c camera - 250\n          )\n            continue;\n          building(frame.providers[i], i, ground, frame);\n        }\n        for (let x = 0; x \u003c streetWidth; x += 94) {\n          line(x, ground + 68, x + 45, ground + 68, \"#b9c8ce\", 2);\n          line(x, ground + 10, x, ground + 36, \"#b3c1c7\");\n        }\n        ctx.restore();\n        const first = Math.max(0, Math.floor((camera - 50) / pitch)),\n          lastIndex = Math.min(\n            15,\n            Math.floor((camera + viewWidth - 60) / pitch),\n          );\n        $(\"view\").textContent =\n          `${frame.providers[first].id} — ${frame.providers[lastIndex].id} · 배치는 가상의 거리`;\n        $(\"year\").textContent = frame.year;\n        $(\"position\").textContent = `${frame.year} / 2036`;\n        $(\"time\").value = Math.round(progress * 1000);\n        $(\"time\").setAttribute(\"aria-valuetext\", `${frame.year}년`);\n        $(\"count\").textContent =\n          `진료 중 ${frame.physicians.filter((d) => d.employed).length} / ${frame.physicians.length}명`;\n        for (let i = 0; i \u003c 16; i++)\n          $(\"place-\" + i).classList.toggle(\n            \"visible\",\n            i >= first && i \u003c= lastIndex,\n          );\n        canvas.setAttribute(\n          \"aria-label\",\n          `${frame.year}년 거리, ${frame.providers[first].id}부터 ${frame.providers[lastIndex].id}. 전체 ${frame.physicians.length}명 중 ${frame.physicians.filter((d) => d.employed).length}명 진료 중. 켜진 창 한 개는 진료 중인 의사 한 명입니다.`,\n        );\n      }\n      function pause() {\n        playing = false;\n        $(\"play\").textContent = \"재생\";\n        $(\"play\").setAttribute(\"aria-pressed\", \"false\");\n      }\n      function animate(now) {\n        if (playing && !document.hidden) {\n          if (last) progress = Math.min(1, progress + (now - last) / 24000);\n          if (progress >= 1) pause();\n          draw();\n        }\n        last = now;\n        requestAnimationFrame(animate);\n      }\n      function resize() {\n        const r = $(\"scene\").getBoundingClientRect();\n        width = r.width;\n        height = r.height;\n        canvas.width = Math.round(width * devicePixelRatio);\n        canvas.height = Math.round(height * devicePixelRatio);\n        draw();\n      }\n      $(\"play\").onclick = () => {\n        if (playing) {\n          pause();\n          return;\n        }\n        if (progress >= 1) progress = 0;\n        manualCamera = null;\n        playing = true;\n        last = 0;\n        $(\"play\").textContent = \"일시정지\";\n        $(\"play\").setAttribute(\"aria-pressed\", \"true\");\n      };\n      $(\"restart\").onclick = () => {\n        pause();\n        progress = 0;\n        manualCamera = null;\n        draw();\n      };\n      $(\"time\").oninput = (e) => {\n        pause();\n        progress = Number(e.target.value) / 1000;\n        manualCamera = null;\n        draw();\n      };\n      $(\"scenario\").onchange = () => {\n        pause();\n        load();\n      };\n      for (let i = 0; i \u003c 16; i++) {\n        const b = document.createElement(\"button\");\n        b.id = \"place-\" + i;\n        b.textContent = `P${i + 1}`;\n        b.setAttribute(\"aria-label\", `P${i + 1} 의료기관 보기, 현재 연도 유지`);\n        b.onclick = () => {\n          pause();\n          manualCamera =\n            60 +\n            i * pitch -\n            width / (2 * Math.min(1.22, Math.max(0.88, height / 375))) +\n            100;\n          draw();\n        };\n        $(\"places\").append(b);\n      }\n      new ResizeObserver(resize).observe($(\"scene\"));\n      load();\n      resize();\n      requestAnimationFrame(animate);\n      document.addEventListener(\"visibilitychange\", () => (last = 0));\n      if (!reduced) $(\"play\").click();\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n"};
