<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>192개의 궤적</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #faf9f6;
        color: #24332f;
        font-family: Arial, "Apple SD Gothic Neo", sans-serif;
        overflow: hidden;
      }
      main {
        position: relative;
        height: 100svh;
        min-height: 480px;
        width: 100%;
        padding: 26px 34px 20px;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        z-index: 1;
        pointer-events: none;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #5c7068;
        margin: 0 0 9px;
      }
      h1 {
        font-size: clamp(21px, 3.2vw, 35px);
        font-weight: 500;
        letter-spacing: -0.06em;
        margin: 0;
        line-height: 1.25;
      }
      #year {
        font-size: clamp(54px, 8vw, 88px);
        letter-spacing: -0.08em;
        line-height: 0.83;
        font-weight: 400;
        color: #314e43;
      }
      .stage {
        flex: 1;
        min-height: 0;
        position: relative;
        margin-top: 12px;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .legend {
        display: flex;
        gap: 16px;
        font-size: 11px;
        color: #51645c;
        margin: 0 0 14px;
        align-items: center;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
        background: #317965;
      }
      .owner {
        background: #bd734d;
      }
      .exit {
        background: none;
        border: 1px solid #52675b;
      }
      .note {
        margin-left: auto;
        color: #717c76;
        font-size: 10px;
      }
      footer {
        border-top: 1px solid #d9dfd9;
        padding-top: 12px;
        display: flex;
        align-items: center;
        gap: 15px;
      }
      button {
        border: 0;
        background: none;
        color: #243f33;
        font-size: 12px;
        cursor: pointer;
        padding: 8px 5px;
        min-width: 38px;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #317965;
        outline-offset: 3px;
      }
      #play {
        font-size: 15px;
        width: 34px;
      }
      input {
        flex: 1;
        min-width: 30px;
        accent-color: #317965;
        height: 3px;
        cursor: pointer;
      }
      time {
        font-variant-numeric: tabular-nums;
        color: #65766c;
        font-size: 11px;
        min-width: 38px;
      }
      .edge {
        font-size: 10px;
        color: #65766c;
      }
      @media (max-width: 520px) {
        main {
          padding: 24px 16px 14px;
        }
        .legend {
          gap: 9px;
          font-size: 10px;
        }
        .note {
          font-size: 9px;
        }
        footer {
          gap: 9px;
        }
        .eyebrow {
          font-size: 9px;
        }
        h1 {
          max-width: 240px;
          font-size: 21px;
        }
        #year {
          font-size: 54px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">01 / HUMAN TRAJECTORIES</p>
          <h1 id="headline">같은 192명에서 시작합니다</h1>
        </div>
        <div id="year">2026</div>
      </header>
      <div class="stage">
        <canvas
          id="scene"
          role="img"
          aria-label="192명 의사의 소득 궤적. 세로 위치는 소득, 빈 원은 진료 이탈입니다."
        ></canvas>
      </div>
      <div class="legend">
        <span><i class="dot"></i>봉직의</span
        ><span><i class="dot owner"></i>소유 의사</span
        ><span><i class="dot exit"></i>진료 이탈</span
        ><small class="note">가상 집단 · 기준 가정</small>
      </div>
      <footer>
        <button id="restart" aria-label="처음부터 재생">↺</button
        ><button id="play" aria-label="일시 정지">Ⅱ</button
        ><span class="edge">2026</span
        ><input
          id="scrub"
          aria-label="연도 탐색"
          type="range"
          min="0"
          max="10"
          step="0.01"
          value="0"
        /><span class="edge">2036</span><time id="clock">00:00</time>
      </footer>
    </main>
    <script type="module">
      import { simulate, DEFAULT_PARAMS } from "../model.mjs";
      const data = simulate(DEFAULT_PARAMS, 42),
        frames = data.frames;
      const canvas = document.querySelector("#scene"),
        ctx = canvas.getContext("2d"),
        scrub = document.querySelector("#scrub"),
        play = document.querySelector("#play");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let progress = 0,
        playing = !reduced,
        last = 0,
        w = 0,
        h = 0;
      const ranks = new Map(
        [...frames[0].physicians]
          .sort((a, b) => a.incomeIndex - b.incomeIndex)
          .map((d, i) => [d.id, i]),
      );
      const leaving = frames.at(-1).physicians.filter((d) => !d.employed),
        exitRanks = new Map(leaving.map((d, i) => [d.id, i]));
      const mix = (a, b, t) => a + (b - a) * t;
      function toggle(value) {
        playing = value;
        play.textContent = playing ? "Ⅱ" : "▶";
        play.setAttribute("aria-label", playing ? "일시 정지" : "재생");
      }
      toggle(playing);
      play.addEventListener("click", () => {
        if (progress >= 10) progress = 0;
        toggle(!playing);
      });
      document.querySelector("#restart").addEventListener("click", () => {
        progress = 0;
        toggle(true);
        draw();
      });
      scrub.addEventListener("input", () => {
        progress = Number(scrub.value);
        toggle(false);
        draw();
      });
      function resize() {
        const r = canvas.getBoundingClientRect();
        w = r.width;
        h = r.height;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        if (!w || !h) return;
        const index = Math.min(9, Math.floor(progress)),
          fraction = progress - index,
          a = frames[index],
          b = frames[index + 1];
        const left = 43,
          top = 35,
          bottom = h - 29,
          split = w * 0.76,
          right = w - 6;
        const py = (income) =>
          bottom - Math.sqrt(Math.max(0, income) / 650) * (bottom - top);
        ctx.font = "10px Arial";
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillStyle = "#6a7c72";
        ctx.fillText("소득 · 제곱근 축 · 2026년 평균 = 100", left, 12);
        ctx.textAlign = "right";
        for (const tick of [0, 25, 100, 225, 400, 625]) {
          let y = py(tick);
          ctx.fillStyle = tick === 100 ? "#3e5e4e" : "#87948d";
          ctx.fillText(String(tick), left - 10, y);
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.strokeStyle = tick === 100 ? "#bac9c0" : "#e3e8e2";
          ctx.lineWidth = tick === 100 ? 1 : 0.65;
          ctx.stroke();
        }
        ctx.fillStyle = "#f1eee7";
        ctx.fillRect(split, top - 12, right - split, bottom - top + 20);
        ctx.strokeStyle = "#d3d9d0";
        ctx.setLineDash([2, 5]);
        ctx.beginPath();
        ctx.moveTo(split, top - 12);
        ctx.lineTo(split, bottom + 8);
        ctx.stroke();
        ctx.setLineDash([]);
        const working = frames[
          Math.min(10, Math.floor(progress))
        ].physicians.filter((d) => d.employed).length;
        ctx.textAlign = "center";
        ctx.fillStyle = "#52695d";
        ctx.font = "10px Arial";
        ctx.fillText(`진료 중 ${working}명`, (left + split) / 2, h - 8);
        ctx.fillText(
          `진료 이탈 ${192 - working}명`,
          (split + right) / 2,
          h - 8,
        );
        for (let i = 0; i < a.physicians.length; i++) {
          const first = a.physicians[i],
            next = b.physicians[i],
            rank = ranks.get(first.id),
            rx = left + 8 + (rank / 191) * (split - left - 21);
          const ex =
            split +
            7 +
            ((exitRanks.get(first.id) ?? rank) /
              Math.max(1, leaving.length - 1)) *
              (right - split - 14);
          const x = mix(
              first.employed ? rx : ex,
              next.employed ? rx : ex,
              fraction,
            ),
            income = mix(first.incomeIndex, next.incomeIndex, fraction),
            y = py(income);
          const color = first.role === "owner" ? "#b36e48" : "#317965";
          ctx.beginPath();
          ctx.moveTo(first.employed ? rx : ex, py(first.incomeIndex));
          ctx.lineTo(x, y);
          ctx.strokeStyle = color + "55";
          ctx.lineWidth = 1.3;
          ctx.stroke();
          const exited = !(fraction < 1 ? first.employed : next.employed);
          ctx.beginPath();
          ctx.arc(x, y, w < 500 ? 2.3 : 3.1, 0, Math.PI * 2);
          ctx.fillStyle = exited ? "#faf9f6" : color;
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 0.9;
          ctx.stroke();
        }
        const year = Math.floor(2026 + progress);
        document.querySelector("#year").textContent = year;
        document.querySelector("#headline").textContent =
          progress < 2
            ? "같은 192명에서 시작합니다"
            : progress < 6
              ? "소득의 궤적이 갈라집니다"
              : progress < 9
                ? "진료를 떠나는 사람이 생깁니다"
                : "2036년, 서로 다른 위치";
        scrub.value = progress;
        document.querySelector("#clock").textContent =
          "00:" + String(Math.floor(progress * 2.4)).padStart(2, "0");
        canvas.setAttribute(
          "aria-label",
          `${year}년. 진료 중 ${working}명, 진료 이탈 ${192 - working}명. 소득은 2026년 평균 대비 지수. 화면은 연도별 결과 사이를 보간합니다.`,
        );
      }
      new ResizeObserver(resize).observe(canvas);
      function tick(time) {
        if (last && playing) {
          progress = Math.min(10, progress + (time - last) / 2400);
          if (progress === 10) toggle(false);
        }
        last = time;
        draw();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
